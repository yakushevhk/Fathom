<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#8fb6cc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8fb6cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#e08c4a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e08c4a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#1d1d1d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- logo mark -->
  <rect x="60" y="56" width="56" height="56" rx="12" fill="#181818" stroke="#333" stroke-width="1.5"/>
  <rect x="74" y="70" width="28" height="28" rx="6" fill="#fcfbfa"/>
  <text x="136" y="93" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" font-weight="600" letter-spacing="1" fill="#ececec">fathom</text>

  <!-- headline -->
  <text x="60" y="310" font-family="Inter, Helvetica, Arial, sans-serif" font-size="86" font-weight="650" letter-spacing="-3" fill="#fcfbfa">One worker.</text>
  <text x="60" y="412" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="92" letter-spacing="-2" fill="#fcfbfa">Every <tspan font-family="Inter, Helvetica, Arial, sans-serif" font-style="normal" font-weight="650" letter-spacing="-3" font-size="86">job done.</tspan></text>

  <!-- sub -->
  <text x="60" y="486" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#9a9a9f">The universal autonomous AI worker — outreach, research, code, operations.</text>

  <!-- bottom mono line -->
  <rect x="60" y="536" width="1080" height="1" fill="#222"/>
  <text x="60" y="576" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" letter-spacing="2" fill="#6a6a6f">SELF-HOSTED · RUST · MEMORY · GOVERNANCE</text>
  <text x="1140" y="576" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" letter-spacing="2" fill="#8fb6cc">fathom.uz</text>
</svg>
