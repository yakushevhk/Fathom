<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fathom Whitepaper — 42-Page Master Presentation Deck</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .deck-nav {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      color: #ffffff;
      font-size: 8.5pt;
    }
    .deck-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 8pt;
      transition: all 0.15s ease;
    }
    .deck-btn:hover { background: #2563eb; }
    .deck-btn-primary { background: #2563eb; }
    .deck-select {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 8pt;
      outline: none;
      max-width: 320px;
    }
    .deck-select option { background: #0f172a; color: #ffffff; }
    iframe.page-frame {
      width: 210mm;
      height: 297mm;
      border: none;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.18);
      border-radius: 4px;
      display: block;
      margin: 20px auto;
      background: #ffffff;
    }
  </style>
</head>
<body style="background: #e2e8f0; margin: 0; padding: 40px 0 80px 0;">

  <div class="deck-nav">
    <button class="deck-btn" onclick="prevPage()">◀ Prev</button>
    <select class="deck-select" id="pageSelect" onchange="jumpToPage(this.value)">
      <option value="1">Page 01: Strategic Overview & Universal Runtime</option><option value="2">Page 02: The Autonomous Digital Employee Paradigm</option><option value="3">Page 03: Virtual Office Topology & Autonomous Coordination</option><option value="4">Page 04: Day in the Life of a Digital Employee Fleet [Mockup: Inbox Zero]</option><option value="5">Page 05: Core Engine Architecture & Sub-Millisecond Dispatch</option><option value="6">Page 06: Autonomous SDR & Corporate Registries [Mockup: SDR Outbound]</option><option value="7">Page 07: Market Intelligence & Competitor Tracking [Mockup: DOM Diff]</option><option value="8">Page 08: Executive Recruiting & Talent Sourcing [Mockup: GitHub AST]</option><option value="9">Page 09: Back-Office & Financial Reconciliation [Mockup: QuickBooks]</option><option value="10">Page 10: DevOps Maintenance & Code Engineering [Mockup: Sentry PR]</option><option value="11">Page 11: Autonomous Research & Deep Intelligence</option><option value="12">Page 12: Self-Healing Background Jobs & Scheduled Routines [Mockup: Swarm DAG]</option><option value="13">Page 13: Automated Outreach: The 7-Layer OSINT Engine</option><option value="14">Page 14: Multi-Source Identity Fusion & Graph Deduplication</option><option value="15">Page 15: Automated Enrichment & Cross-Platform Corroboration</option><option value="16">Page 16: SMTP 250 OK Gauntlet & Deliverability Engine</option><option value="17">Page 17: Multi-Channel Outbound Dispatch [Mockup: Instantly Bridge]</option><option value="18">Page 18: Goal-Oriented Autonomous Search & LLM Judge</option><option value="19">Page 19: Zero-Bounce Deliverability & Anti-Spam Pipeline [Mockup: Audit Table]</option><option value="20">Page 20: Two-Way CRM Synchronization & Autonomous Deal Staging</option><option value="21">Page 21: Computer Use: Sandboxed Browser & Desktop Automation</option><option value="22">Page 22: Accessibility Trees vs Visual Coordinate Scripts</option><option value="23">Page 23: Governed Execution & 2FA Human Takeover [Mockup: AWS 2FA]</option><option value="24">Page 24: Live Human Supervision, Telegram Approval & Takeover [Mockup: CS REPL]</option><option value="25">Page 25: Sub-Millisecond Tokio Dispatch Engine (~0.75 ms)</option><option value="26">Page 26: Enterprise Security Architecture & AES-256-GCM Vault [Mockup: Vault]</option><option value="27">Page 27: Regulatory Compliance, Legal Audits & Risk Matrices [Mockup: Legal MSA]</option><option value="28">Page 28: Hardware Efficiency & High-Concurrency Benchmarks</option><option value="29">Page 29: Cold Start, Concurrency & Memory Profiles</option><option value="30">Page 30: Long-Term Memory & Entity Knowledge Graphs [Mockup: Graph]</option><option value="31">Page 31: Self-Healing Infrastructure & Error Diagnostics</option><option value="32">Page 32: HTTP Server, Axum Router & SSE Real-Time Protocol</option><option value="33">Page 33: Multi-Channel Gateway (Telegram, Slack, Discord, Web)</option><option value="34">Page 34: The Self-Replicating Growth Loop & Inbound Engine</option><option value="35">Page 35: Customer Acquisition & The Free Value Audit Flywheel</option><option value="36">Page 36: Pricing Architecture: Flat-Rate Unlimited Seat Economics</option><option value="37">Page 37: Agency Scaling, Multi-Tenancy & White-Label Deployments [Mockup: Agency Fleet]</option><option value="38">Page 38: Total Cost of Ownership & 90%+ Gross Margin Unit Economics</option><option value="39">Page 39: Enterprise Deployment Topologies (Bare-Metal, Cloud, Edge)</option><option value="40">Page 40: High-Availability, Clustering & State Synchronization</option><option value="41">Page 41: Enterprise SLA, Disaster Recovery & Continuous Auditing</option><option value="42">Page 42: Conclusion: The Autonomous Enterprise Era & Roadmap</option>
    </select>
    <button class="deck-btn" onclick="nextPage()">Next ▶</button>
    <span style="color: rgba(255,255,255,0.4);">|</span>
    <button class="deck-btn" onclick="toggleViewMode(this)" id="viewModeBtn">Show All 42 Pages</button>
    <a href="Fathom_Whitepaper.pdf" target="_blank" class="deck-btn deck-btn-primary" style="text-decoration:none;">📄 Download PDF (14.6 MB)</a>
    <a href="mockups/index.html" target="_blank" class="deck-btn" style="text-decoration:none; background:#4f46e5;">🖼 15 HD Mockups</a>
  </div>

  <div id="deckContainer">
    <iframe class="page-frame" id="singleFrame" src="page_01.html"></iframe>
  </div>

  <script>
    let cur = 1;
    const total = 42;
    let isAllView = false;

    function jumpToPage(num) {
      cur = parseInt(num);
      document.getElementById('pageSelect').value = cur;
      if (!isAllView) {
        document.getElementById('singleFrame').src = 'page_' + String(cur).padStart(2, '0') + '.html';
        window.scrollTo(0, 0);
      } else {
        const el = document.getElementById('frame-' + cur);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function prevPage() {
      if (cur > 1) jumpToPage(cur - 1);
    }

    function nextPage() {
      if (cur < total) jumpToPage(cur + 1);
    }

    function toggleViewMode(btn) {
      const container = document.getElementById('deckContainer');
      isAllView = !isAllView;
      if (isAllView) {
        btn.innerText = "Single Slide Mode";
        let html = '';
        for (let i = 1; i <= total; i++) {
          html += '<iframe class="page-frame" id="frame-' + i + '" src="page_' + String(i).padStart(2, '0') + '.html"></iframe>';
        }
        container.innerHTML = html;
      } else {
        btn.innerText = "Show All 42 Pages";
        container.innerHTML = '<iframe class="page-frame" id="singleFrame" src="page_' + String(cur).padStart(2, '0') + '.html"></iframe>';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
    });
  </script>

</body>
</html>
