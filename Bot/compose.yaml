name: ${COMPOSE_PROJECT_NAME:-parallel}
services:
  omb:
    init: true
    platform: linux/amd64
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${OMB_BASE_IMAGE:-parallel:local}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex opencode-ai @qwen-code/qwen-code @earendil-works/pi-coding-agent}
    image: ${OMB_LOCAL_IMAGE:-parallel-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${OMB_BIND_ADDRESS:-127.0.0.1}:${OMB_HTTP_PORT:-8080}:80"
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      OMB_PUBLIC_URL: ${OMB_PUBLIC_URL:-http://localhost:${OMB_HTTP_PORT:-8080}}
      OMB_WEBHOOK_PUBLIC_URL: ${OMB_WEBHOOK_PUBLIC_URL:-${OMB_PUBLIC_URL:-http://localhost:${OMB_HTTP_PORT:-8080}}}
      OMB_MUTATION_TOKEN: ${OMB_MUTATION_TOKEN:-local-dev-token}
      ROUTER_API_KEY: "sk-shenzhen"
      ROUTER_BASE_URL: "https://router.y7.hk/v1"
      OPENAI_API_KEY: "sk-shenzhen"
      OPENAI_BASE_URL: "https://router.y7.hk/v1"
      OPENAI_COMPAT_API_KEY: "sk-shenzhen"
      OPENAI_COMPAT_URL: "https://router.y7.hk/v1"
      OPENAI_COMPAT_MODEL: "antigravity/gemini-3.8-flash-high"
      OPENROUTER_API_KEY: "sk-shenzhen"
      OPENROUTER_BASE_URL: "https://router.y7.hk/v1"
      OPENCODE_API_KEY: "sk-shenzhen"
      ANTHROPIC_API_KEY: "sk-shenzhen"
      ANTHROPIC_BASE_URL: "https://router.y7.hk/v1"
      QWEN_API_KEY: "sk-shenzhen"
      XAI_API_KEY: "sk-shenzhen"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(/(openmausbot|parallel)/).test(await r.text())) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:omb
    environment:
      OMB_HTTPS_HOST: ${OMB_HTTPS_HOST:-}
      OMB_BIND_ADDRESS: ${OMB_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export OMB_UPSTREAM_SCHEME=http
        if [ -n "$$OMB_HTTPS_HOST" ] && [ "$$OMB_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "OMB_HTTPS_HOST requires OMB_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$OMB_HTTPS_HOST" ]; then
          export OMB_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      omb:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${OMB_DATA_EXTERNAL:-false}
    name: ${OMB_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-parallel}_data}
  caddy_data:
  caddy_config:
