name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev bubblewrap

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check workspace
        run: cargo check --workspace --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  node:
    name: Frontend & Website Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Web App
        run: |
          cd apps/web
          npm ci
          npm run build

      - name: Check Computer Use Service
        run: |
          cd apps/computer
          npm ci
          npm run typecheck

      - name: Build Bee Workspace
        run: |
          cd Bee
          npm ci
          npm run lint
          npm run build

      - name: Build Astro Website
        run: |
          cd website
          npm ci
          npm run build
